name: Release
on:
  push:
    branches: [next, main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    if: github.repository == 'hiddenlayerai/hiddenlayer-sdk-python' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    steps:
      - uses: hiddenlayerai/release-please-action@hl-v1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          changes-branch: next
          skip-github-release: true

  release:
    if: github.repository == 'hiddenlayerai/hiddenlayer-sdk-python' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: hiddenlayerai/release-please-action@hl-v1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          changes-branch: next
          skip-github-pull-request: true

      - name: Dispatch publish
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: gh workflow run publish-pypi.yml --ref "${{ steps.release.outputs.tag_name }}"

      - name: Merge main back into next
        if: steps.release.outputs.release_created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          git fetch origin main next
          git checkout next
          git merge origin/main --no-edit
          git push origin next
